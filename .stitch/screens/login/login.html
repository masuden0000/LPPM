<body class="bg-background min-h-screen flex flex-col items-center justify-center font-body-base text-on-background antialiased p-md">
<!-- Main Content Canvas -->
<main class="w-full max-w-[400px]">
<!-- Login Card -->
<div class="bg-surface-container-lowest border border-surface-variant rounded-xl shadow-[0px_10px_15px_-3px_rgba(0,0,0,0.05),0px_4px_6px_-4px_rgba(0,0,0,0.05)] p-xl w-full">
<!-- Header Section -->
<div class="text-center mb-xl">
<!-- Brand Placeholder if needed, omitted for minimalism based on prompt -->
<h1 class="font-h2 text-h2 text-on-surface mb-sm">Masuk ke LPPM UPNVJ</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Masukkan email dan kata sandi Anda untuk mengakses dashboard</p>
</div>
<!-- Form Section -->
<form action="#" class="space-y-lg" method="POST">
<!-- Email Field -->
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface" for="email">Email</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-surface-variant rounded-lg px-md py-sm font-body-base text-body-base text-on-surface placeholder:text-outline-variant focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="email" name="email" placeholder="nama@email.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="block font-label-md text-label-md text-on-surface" for="password">Kata Sandi</label>
<a class="font-label-sm text-label-sm text-primary hover:underline focus:outline-none focus:underline" href="#">Lupa kata sandi?</a>
</div>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-surface-variant rounded-lg px-md py-sm font-body-base text-body-base text-on-surface placeholder:text-outline-variant focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-label-md text-label-md rounded-lg py-[10px] px-md hover:bg-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background transition-colors flex items-center justify-center gap-sm" type="submit">
                    Masuk
                </button>
</form>
<!-- Footer / Secondary Action -->
<div class="mt-xl text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Belum punya akun? 
                    <a class="font-label-md text-label-md text-primary hover:underline focus:outline-none focus:underline" href="#">Daftar sekarang</a>
</p>
</div>
</div>
</main>
<!-- Footer Component - Excluded from rendering per Semantic Shell Mandate (Transactional page) -->
